name: gep-harness-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphviz
        run: sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pytest-cov flask cryptography

      - name: Run GEP strict validation
        run: make verify

      - name: Check docs consistency (version/commit/pytest)
        run: python3 scripts/docs_lint.py

      - name: Run pytest
        run: |
          set +e
          make test > pytest-out.txt 2>&1
          code=$?
          tail -n 120 pytest-out.txt
          if [ "$code" -ne 0 ]; then
            tail -n 40 pytest-out.txt | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '\r' ' ' | cut -c1-180)
              [ -n "$safe" ] || continue
              echo "::error title=pytest::${safe}"
            done
            exit "$code"
          fi

      - name: Generate 5-format graph (PNG+SVG+PDF+EPS)
        run: |
          python3 scripts/visualize_5lib_graph.py --png --svg --pdf --embed-index

      - name: Upload 5-format graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5lib-graph
          path: |
            docs/5LIB_GRAPH.png
            docs/5LIB_GRAPH.svg
            docs/5LIB_GRAPH.pdf
            docs/5LIB_GRAPH.eps

      - name: Test coverage report
        run: |
          python3 -m pytest scripts/tests/ openclaw-a2a/tests/ --cov=scripts --cov-report=term-missing